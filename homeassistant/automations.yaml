# Reference copy. Paste into Home Assistant via Settings → Automations →
# Create Automation → Edit in YAML, one automation per entry.
#
# Times are the starting point, not gospel. Adjust to suit.
#
# The device has two independent switches, one per icon, and three useful
# states: moon on (night), sun on (the morning wake window), and both off
# (ordinary daytime). The firmware enforces mutual exclusion, so turning one
# on always extinguishes the other.
#
# entity_id note: firmware/daynight.yaml sets both `name: daynight` and
# `friendly_name: "Day/Night Indicator"`. Setting friendly_name makes
# ESPHome/Home Assistant combine the friendly device name with each entity's
# own name to build the entity_id (has_entity_name semantics), NOT the raw
# `name:` slug. For the template switches `id: moon_icon, name: "Moon icon"`
# and `id: sun_icon, name: "Sun icon"` that yields
# switch.day_night_indicator_moon_icon and switch.day_night_indicator_sun_icon
# — the values used below, per
# https://www.home-assistant.io/integrations/esphome/.
#
# Entity_ids are only assigned once, at first registration, and HA does not
# rename an already-registered entity if you re-flash with different naming
# or run an older HA/ESPHome version. Before relying on these automations,
# confirm the real ids on your instance: Developer Tools → States (search
# "moon_icon" and "sun_icon"), or Settings → Devices & Services → ESPHome →
# the daynight device → check the two switch entities' ids. The candidates
# you may see are switch.day_night_indicator_moon_icon /
# switch.day_night_indicator_sun_icon (current, friendly_name-based) or
# switch.daynight_moon_icon / switch.daynight_sun_icon (legacy,
# name-slug-based). This firmware also replaces an earlier single
# switch.day_night_indicator_night_mode, which may still be listed as an
# unavailable leftover — it is not the entity you want. If the ids here don't
# match, update every entity_id line below — otherwise the automations will
# trigger, report success, and do nothing, because they're silently pointed
# at an entity that doesn't exist.

- alias: "Day/Night — moon at bedtime"
  description: "Show the moon from bedtime. The firmware clears the sun automatically."
  triggers:
    - trigger: time
      at: "19:00:00"
  actions:
    - action: switch.turn_on
      target:
        entity_id: switch.day_night_indicator_moon_icon
  mode: single

- alias: "Day/Night — sun at wake time (weekdays)"
  description: "Show the sun on school mornings."
  triggers:
    - trigger: time
      at: "06:30:00"
  conditions:
    - condition: time
      weekday: [mon, tue, wed, thu, fri]
  actions:
    # No moon-off action is needed: the firmware extinguishes the moon and
    # clears its switch whenever the sun switch is turned on.
    - action: switch.turn_on
      target:
        entity_id: switch.day_night_indicator_sun_icon
  mode: single

- alias: "Day/Night — sun at wake time (weekend)"
  description: "Show the sun later at weekends."
  triggers:
    - trigger: time
      at: "07:30:00"
  conditions:
    - condition: time
      weekday: [sat, sun]
  actions:
    # Same as the weekday automation: turning the sun on clears the moon.
    - action: switch.turn_on
      target:
        entity_id: switch.day_night_indicator_sun_icon
  mode: single

- alias: "Day/Night — dark for the day"
  description: >-
    End the wake window. Both icons dark for the rest of the day, which is the
    ordinary daytime state — nobody needs a lit sun at 2pm.
  triggers:
    - trigger: time
      at: "08:30:00"
  actions:
    - action: switch.turn_off
      target:
        entity_id: switch.day_night_indicator_sun_icon
  mode: single
