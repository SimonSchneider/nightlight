# Bring-up test. Not the real firmware — see daynight.yaml for that.
#
# Purpose: prove the wiring works before anything is assembled. It answers four
# questions in one run, without needing WiFi, Home Assistant, or a network:
#
#   1. Does the data line work at all?
#   2. Which physical pixel is index 0? (index 0 must end up behind the SUN)
#   3. Is rgb_order right? (a step labelled RED must look red, not green)
#   4. Are both pixels alive?
#
# WIRING — three wires from the strip's INPUT end (follow the arrows on the strip;
# they point away from the input):
#
#   strip VCC  -> board 3V3   (see the note below before using 5V)
#   strip GND  -> board GND
#   strip DIN  -> board GPIO4
#
# GPIO4 is not optional in spirit: GPIO2, GPIO8 and GPIO9 are ESP32-C3 strapping
# pins sampled during boot, and RST is the chip's reset input, not a GPIO at all.
# Nothing can be driven out of RST.
#
# On 3V3 vs 5V: a WS2812 running at 5 V wants 3.5 V to register a logic high, and
# the C3's GPIO only reaches 3.3 V. That is out of spec and is a well-known source
# of intermittent glitches. Running the strip from 3V3 drops the threshold to
# 2.3 V and makes the data line comfortably valid, at the cost of some peak
# brightness. If 5 V appears to work on the bench and then misbehaves once the
# wires are longer and tucked into the enclosure, this is why.
#
# THE SEQUENCE, one step every 700 ms, looping forever:
#
#   1. pixel 0 RED        5. pixel 1 GREEN
#   2. pixel 0 GREEN      6. pixel 1 BLUE
#   3. pixel 0 BLUE       7. both WHITE
#   4. pixel 1 RED        8. both off  (the gap marks the start of a cycle)
#
# WHAT THE FAILURES MEAN:
#
#   Nothing lights          -> data wire is on the wrong pin, GND is not shared,
#                              or the strip is wired from its OUTPUT end.
#   Only the first lights   -> the second pixel's DIN is not connected to the
#                              first pixel's DOUT, or that joint is dry.
#   Colours are swapped     -> rgb_order is wrong. Try GRB / RGB / BRG below.
#   Flicker or random colour-> data threshold problem. Move VCC from 5V to 3V3.
#   Steps 1-3 light the pixel you intended as the moon
#                           -> the chain runs the wrong way. Swap which physical
#                              pixel you mount behind the sun, rather than
#                              editing the real firmware.
#
# FLASHING: this config has no wifi: and no api: on purpose, so it runs standalone
# straight from USB with nothing else set up. Flash it from the ESPHome Builder
# add-on with the board plugged into the machine running the browser.

esphome:
  name: blinktest
  on_boot:
    priority: -100
    then:
      - light.turn_on:
          id: strip
          brightness: 30%
          effect: "Bring-up"

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:

light:
  - platform: esp32_rmt_led_strip
    id: strip
    name: "Bring-up strip"
    pin: GPIO4
    num_leds: 2
    chipset: WS2812
    rgb_order: GRB      # if red shows as green, try RGB; if as blue, try BRG
    default_transition_length: 0s
    effects:
      - addressable_lambda:
          name: "Bring-up"
          update_interval: 700ms
          lambda: |-
            static int step = 0;
            it.all() = Color::BLACK;
            switch (step) {
              case 0: it[0] = Color(255,   0,   0); break;  // pixel 0 red
              case 1: it[0] = Color(  0, 255,   0); break;  // pixel 0 green
              case 2: it[0] = Color(  0,   0, 255); break;  // pixel 0 blue
              case 3: it[1] = Color(255,   0,   0); break;  // pixel 1 red
              case 4: it[1] = Color(  0, 255,   0); break;  // pixel 1 green
              case 5: it[1] = Color(  0,   0, 255); break;  // pixel 1 blue
              case 6: it.all() = Color(255, 255, 255); break;
              default: break;                               // step 7: both off
            }
            step = (step + 1) % 8;
