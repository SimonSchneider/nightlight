substitutions:
  device_name: daynight
  friendly_name: "Day/Night Indicator"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    # -100 runs last, after switch and number components have restored their
    # values from flash. Re-applying here removes any dependence on the order
    # in which those two components come up.
    priority: -100
    then:
      - script.execute: apply_state

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

# Default settings are correct for the C3. It logs over USB CDC when plugged
# in, and over the API to Home Assistant otherwise. No hardware_uart setting
# is needed with the esp-idf framework.
logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "DayNight Fallback"
    password: !secret fallback_password

captive_portal:

light:
  # The physical strip. Never exposed to Home Assistant.
  - platform: esp32_rmt_led_strip
    id: strip
    pin: GPIO4
    num_leds: 2
    chipset: WS2812
    rgb_order: GRB
    internal: true

  # Both partitions are internal too. The Home Assistant interface is the two
  # switches below plus the two brightness numbers — nothing else. Exposing
  # these as light entities as well would put a "Sun" light beside a "Sun icon"
  # switch, two controls for one pixel, with only the switch enforcing mutual
  # exclusion.
  - platform: partition
    id: sun_light
    internal: true
    default_transition_length: 20s
    segments:
      - id: strip
        from: 0
        to: 0

  - platform: partition
    id: moon_light
    internal: true
    default_transition_length: 20s
    segments:
      - id: strip
        from: 1
        to: 1

number:
  - platform: template
    id: night_brightness
    name: "Night brightness"
    optimistic: true
    restore_value: true
    initial_value: 2
    # Floor of 1, not 0. At 0 a *lit* moon renders dark, which is exactly the
    # "unplugged or broken" state the two-icon design exists to prevent — and
    # it is one slider drag away while tuning at 1-2 %. (Both icons dark is a
    # legitimate daytime state; a lit icon that renders dark is not.)
    min_value: 1
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    on_value:
      - script.execute: apply_state

  - platform: template
    id: day_brightness
    name: "Day brightness"
    optimistic: true
    restore_value: true
    initial_value: 80
    # Floor of 1 for the same reason as night_brightness: at 0 a lit sun would
    # render dark and be indistinguishable from a dead device.
    min_value: 1
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    on_value:
      - script.execute: apply_state

script:
  # show_moon / show_sun are the mutual-exclusion mechanism. Each one lights
  # its own icon, extinguishes the other icon's pixel, and marks the other
  # switch off so Home Assistant's view matches the panel.
  #
  # The other switch is cleared with publish_state(false) via a lambda, NOT
  # with switch.turn_off. publish_state only updates the reported state; it
  # does not fire that switch's turn_off_action, so the two switches cannot
  # trigger each other in a loop. The other icon's pixel is already turned off
  # explicitly on the line above, so no action needs to run for it.
  - id: show_moon
    mode: restart
    then:
      - light.turn_off: sun_light
      - lambda: 'id(sun_icon).publish_state(false);'
      - light.turn_on:
          id: moon_light
          red: 100%
          green: 45%
          blue: 0%
          brightness: !lambda 'return id(night_brightness).state / 100.0;'

  - id: show_sun
    mode: restart
    then:
      - light.turn_off: moon_light
      - lambda: 'id(moon_icon).publish_state(false);'
      - light.turn_on:
          id: sun_light
          red: 100%
          green: 85%
          blue: 60%
          brightness: !lambda 'return id(day_brightness).state / 100.0;'

  # Three states: moon lit, sun lit, or both dark (ordinary daytime — normal
  # and expected). The invariant is AT MOST one icon lit, never both.
  #
  # Used only where the switches' states are already settled: at boot, and
  # when a brightness number changes. NOT used from a switch's own actions —
  # see the note on the switches below.
  #
  # If both switches somehow restore ON from flash, the moon wins: a child
  # woken at 3am should see night. show_moon then clears the sun switch, so
  # the impossible state does not survive the boot.
  - id: apply_state
    mode: restart
    then:
      - if:
          condition:
            switch.is_on: moon_icon
          then:
            - script.execute: show_moon
          else:
            - if:
                condition:
                  switch.is_on: sun_icon
                then:
                  - script.execute: show_sun
                else:
                  - light.turn_off: moon_light
                  - light.turn_off: sun_light

switch:
  # Two independent switches, one per icon, giving three useful states:
  # moon on = night, sun on = the morning wake window, both off = daytime.
  # Mutual exclusion is enforced here in the firmware rather than left to
  # Home Assistant, because any automation-ordering mistake could otherwise
  # light both icons at once, which means nothing to a child.
  #
  # Each switch's actions call show_moon / show_sun directly rather than going
  # through apply_state. A template switch fires its action BEFORE publishing
  # its new state, so anything reading switch.is_on for the switch being
  # toggled would read the OLD value and drive the wrong icon on every toggle.
  # Nothing below reads the state of the switch it belongs to.
  - platform: template
    id: moon_icon
    name: "Moon icon"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - script.execute: show_moon
    turn_off_action:
      # Only this icon goes dark. The sun is left exactly as it was, which is
      # normally off — both dark is ordinary daytime.
      - light.turn_off: moon_light

  - platform: template
    id: sun_icon
    name: "Sun icon"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - script.execute: show_sun
    turn_off_action:
      - light.turn_off: sun_light
